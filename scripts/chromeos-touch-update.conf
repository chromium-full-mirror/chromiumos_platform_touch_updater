description     "Touch firmware and config updater for Chromebooks"
author          "chromium-os-dev@chromium.org"

# This job has no main script so that it only runs once at boot.
# This will block the start of the first UI in order to do the fw/config
# update.
start on starting ui

pre-start script
  for dev in "/sys/bus/i2c/devices"/*/name; do
    local dev_name="$(cat "${dev}")"
    local path="${dev%/name}"

    # Skip over bogus devices in /sys/bus/i2c/devices/1-00*
    if [ ! -e "${path}/update_fw" ]; then
      continue
    fi

    case "${dev_name}" in
    cyapa)
      /opt/google/touch/scripts/chromeos-touch-firmware-update.sh -d cyapa -r ||
        logger -t "$UPSTART_JOB" "${dev_name} firmware update failed."
      ;;
    elan_i2c|ELAN0000*)
      /opt/google/touch/scripts/chromeos-touch-firmware-update.sh \
        -d "${dev_name}" -n elan_i2c.bin -r ||
        logger -t "$UPSTART_JOB" "${dev_name} firmware update failed."
      ;;
    elants_i2c|ELAN0001*)
      /opt/google/touch/scripts/chromeos-touch-firmware-update.sh \
        -d "${dev_name}" -n elants_i2c.bin -r ||
        logger -t "$UPSTART_JOB" "${dev_name} firmware update failed."
      ;;
    atmel_mxt_tp|ATML0000*)
      # Atmel mXT touchpad firmware and config must be updated in tandem.
      /opt/google/touch/scripts/chromeos-touch-firmware-update.sh \
        -d "${dev_name}" -r -n maxtouch-tp.fw ||
        logger -t "$UPSTART_JOB" "${dev_name} firmware update failed."
      /opt/google/touch/scripts/chromeos-touch-config-update.sh \
        -d "${dev_name}" ||
        logger -t "$UPSTART_JOB" "${dev_name} config update failed."
      ;;
    atmel_mxt_ts|ATML0001*)
      # Atmel mXT touchscreen firmware and config must be updated in tandem.
      /opt/google/touch/scripts/chromeos-touch-firmware-update.sh \
        -d "${dev_name}" -r -n maxtouch-ts.fw ||
        logger -t "$UPSTART_JOB" "${dev_name} firmware update failed."
      /opt/google/touch/scripts/chromeos-touch-config-update.sh \
        -d "${dev_name}" ||
        logger -t "$UPSTART_JOB" "${dev_name} config update failed."
      ;;
    esac
  done
end script
